<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problem 3 - Nested Tables</title>
  <style>
    table {
      border: 2px double black;
      padding: 20px;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td>
        <a href="https://antra.net/" target="_blank">
          <img src="images/Antra-white.png" alt="Antra Logo" width="100">
        </a>
      </td>
      <td>
        <table>
          <tr><td><h1>Software</h1></td></tr>
          <tr><td><h1>Developer</h1></td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
