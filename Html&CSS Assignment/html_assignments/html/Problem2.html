<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Results Table</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Web fundamentals exam results</h2>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>01</td><td>Gosho</td><td>Goshev</td><td>500</td></tr>
      <tr><td>02</td><td>Tosho</td><td>Toshev</td><td>500</td></tr>
      <tr><td>03</td><td>Pesho</td><td>Pesho</td><td>500</td></tr>
      <tr><td>04</td><td>Gencho</td><td>Genchev</td><td>500</td></tr>
      <tr><td>05</td><td>Draga</td><td>Draganova</td><td>500</td></tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5">Average score from 05 participants: 500</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
